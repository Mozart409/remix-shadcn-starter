version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 10
      semver-major-days: 10
      semver-minor-days: 10
      semver-patch-days: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
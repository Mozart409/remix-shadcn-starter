pre-commit:
  commands:
    typecheck:
      run: pnpm run typecheck
    keep-sorted:
      glob: "*.{nix,js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,md}"
      run: |
        if command -v keep-sorted >/dev/null 2>&1; then
          keep-sorted {staged_files}
        else
          echo "keep-sorted not found, skipping..."
        fi
      stage_fixed: true
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: |
        if command -v biome >/dev/null 2>&1; then
          biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
        else
          npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
        fi
        git update-index --again
      stage_fixed: true
    lockfile:
      glob: "package.json"
      run: pnpm install --no-frozen-lockfile
      stage_fixed: true
pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm run lint
      stage_fixed: true
    build:
      run: pnpm run build
